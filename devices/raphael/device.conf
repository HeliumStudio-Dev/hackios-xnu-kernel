# Redmi K20 Pro: combined RAM bring-up; see docs/RAPHAEL.md.
NAME="Redmi K20 Pro (raphael)"
KIND=phone
SOC="Qualcomm Snapdragon 855 (SM8150)"
UEFI_TARGET=raphael
UEFI_FD=${UEFI_FD:-}
DTB=out/raphael/raphael.dtb
# Confirmed against this phone's XBL; DEBUG UEFI screen and loader USB verified.
FD_BASE=0x9FC00000
FD_SIZE=0x300000
PAYLOAD_BASE=0xF0000000
FB_BASE=0x9C000000
WIFI_ATH11K=0
WIFI_ATH10K=0
# Keep storage/radios off while CPU, display, input and A640 are tested together.
BOOTARGS="gic_timer_irq=19 cpus=1 touchscreen=1 buttons=1 cpufreq=0 gpu=0 wifi=0 modem=0 adsp=0 ufs=0 ufs_write=0"
DEFAULT_SECS=300
USERLAND_VARS="REST=1 QUIET=1 OSLOG= RC=$ROOT/userland/rc.launchd RC_JOBS="
FIRMWARE=""
